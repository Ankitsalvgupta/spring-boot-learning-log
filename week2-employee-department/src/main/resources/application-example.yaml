# Example configuration — copy this file to application.yaml and fill in your own local values.

spring:
  application:
    name: employeeDepartment
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:file:/path/to/your/local/db
    username: your-username
    password: your-password
  jpa:
    hibernate:
      ddl-auto: update